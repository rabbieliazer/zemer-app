name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass

      - name: Run Gradle build for Windows native distribution
        run: .\gradlew.bat :windows-desktop:package --no-daemon --console=plain

      - name: List build output
        run: dir windows-desktop\build\compose\binaries\ -Recurse

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zemer-windows-installers
          path: |
            windows-desktop\build\compose\binaries\**\*
            windows-desktop\build\distributions\**\*
